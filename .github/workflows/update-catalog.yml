name: Update coin catalog

on:
  push:
    paths:
      - "incoming/**"
      - "scripts/update_coins.py"
      - "scripts/export_excel.py"
      - "data/Euro_Coin_Catalog_Template.xlsx"

  workflow_dispatch:

concurrency:
  group: update-coin-catalog
  cancel-in-progress: false

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.COIN_CATALOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.COIN_CATALOG_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate and publish catalog
        shell: bash
        run: |
          set -e

          git config user.name "coin-catalog-admin[bot]"
          git config user.email "coin-catalog-admin[bot]@users.noreply.github.com"

          for attempt in 1 2 3
          do
            echo "======================================"
            echo "Catalog generation attempt ${attempt}"
            echo "======================================"

            #
            # Always start from the newest public main.
            #
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            #
            # Generate everything again from the current
            # coins-source.json.
            #
            python scripts/update_coins.py
            python scripts/export_excel.py

            git add \
              data/coins.json \
              data/Euro_Coin_Catalog_Automation.xlsx \
              images/coins \
              incoming

            if git diff --cached --quiet
            then
              echo "No generated changes to publish"
              exit 0
            fi

            git commit -m "Update coin catalog"

            #
            # Push only if main has not changed while
            # we were generating the files.
            #
            if git push origin HEAD:main
            then
              echo "Catalog published successfully"
              exit 0
            fi

            echo "Public main changed during generation."

            if [ "${attempt}" -eq 3 ]
            then
              echo "Failed to publish catalog after 3 attempts"
              exit 1
            fi

            echo "Regenerating from the newest main..."
            sleep $((attempt * 2))
          done
