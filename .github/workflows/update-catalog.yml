name: Update coin catalog

on:
  push:
    paths:
      - "data/Euro_Coin_Catalog_Automation.xlsx"
      - "incoming/**"
      - "scripts/update_coins.py"

  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: update-coin-catalog
  cancel-in-progress: false
jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Update catalog
        run: |
          python scripts/update_coins.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/coins.json images/coins incoming

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update coin catalog"
            git pull --rebase origin main
            git push origin main
          fi
