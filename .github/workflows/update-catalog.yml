name: Update coin catalog

on:
  push:
    paths:
      - "data/coins-source.json"
      - "images/coins/**"
      - "incoming/**"
      - "scripts/update_coins.py"
      - "scripts/export_excel.py"
      - "data/Euro_Coin_Catalog_Template.xlsx"

  workflow_dispatch:

concurrency:
  group: update-coin-catalog
  cancel-in-progress: false

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.COIN_CATALOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.COIN_CATALOG_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Update catalog
        run: |
          python scripts/update_coins.py

      - name: Export Excel backup
        run: |
          python scripts/export_excel.py

      - name: Commit generated changes
        run: |
          git config user.name "coin-catalog-admin[bot]"
          git config user.email "coin-catalog-admin[bot]@users.noreply.github.com"

          git add data/coins.json data/Euro_Coin_Catalog_Automation.xlsx images/coins incoming

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update coin catalog"
            git pull --rebase origin main
            git push origin main
          fi
