<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Euro Coin Collection</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <div class="brand-mark">€</div>
      <div>
        <h1>My Euro Coin Collection</h1>
        <p>Regular euro coins and €2 commemoratives</p>
      </div>
    </div>

    <div class="header-actions">
      <button id="themeToggle" class="secondary-btn" type="button">🌙 Dark</button>
      <button id="viewToggle" class="secondary-btn" type="button">▦ Table</button>
    </div>
  </header>

  <nav class="main-nav">
    <button class="nav-link active" data-section="all">Home</button>
    <button class="nav-link" data-section="regular">Regular €</button>
    <button class="nav-link" data-section="commemorative">2€ Commemorative</button>
    <button class="nav-link" data-section="missing">Missing</button>
    <button class="nav-link" data-section="duplicates">Duplicates</button>
    <button class="nav-link" data-section="statistics">Statistics</button>
  </nav>

  <main class="page-shell">
    <section class="stats-grid" id="statsGrid"></section>

    <section class="filters-panel">
      <div class="filter-group">
        <label for="countryFilter">Country</label>
        <select id="countryFilter">
          <option value="">All countries</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="yearFilter">Year</label>
        <select id="yearFilter">
          <option value="">All years</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="denominationFilter">Denomination</label>
        <select id="denominationFilter">
          <option value="">All denominations</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="conditionFilter">Condition</label>
        <select id="conditionFilter">
          <option value="">All conditions</option>
        </select>
      </div>

      <div class="filter-group search-group">
        <label for="searchInput">Search</label>
        <input id="searchInput" type="search" placeholder="Country, coin name, year..." />
      </div>
    </section>

    <section class="section-heading">
      <div>
        <h2 id="sectionTitle">Collection</h2>
        <p id="resultCount"></p>
      </div>
    </section>

    <section id="coinGrid" class="coin-grid"></section>

    <section id="coinTableWrap" class="coin-table-wrap hidden">
      <table class="coin-table">
        <thead>
          <tr>
            <th>Country</th>
            <th>Year</th>
            <th>Denomination</th>
            <th>Type</th>
            <th>Name</th>
            <th>Condition</th>
            <th>Status</th>
            <th>Duplicates</th>
          </tr>
        </thead>
        <tbody id="coinTableBody"></tbody>
      </table>
    </section>
  </main>

  <footer class="site-footer">
    <p>My Euro Coin Collection</p>
  </footer>

  <div id="coinModal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>

    <article class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" type="button" aria-label="Close" data-close-modal>×</button>

      <div class="modal-image-panel" id="modalImagePanel"></div>

      <div class="modal-content">
        <div class="modal-country" id="modalCountry"></div>
        <h2 id="modalTitle"></h2>
        <div class="modal-subtitle" id="modalSubtitle"></div>
        <div class="badges" id="modalBadges"></div>

        <div class="modal-facts" id="modalFacts"></div>

        <section class="modal-text-section" id="descriptionSection">
          <h3>Description</h3>
          <p id="modalDescription"></p>
        </section>

        <section class="modal-text-section" id="notesSection">
          <h3>My notes</h3>
          <p id="modalNotes"></p>
        </section>
      </div>
    </article>
  </div>

  <script src="app.js"></script>
</body>
</html>
